name: Terraform (platform)

# Platform layer — the EKS cluster and everything around it (VPC, ALB,
# Karpenter, ArgoCD). Rebuildable on EKS teardown. See
# envs/prod/eu-west-1/foundation/ for the persistent layer.
#
# Runs on ubuntu-latest (was arc-runner-set-terraform, which dies with EKS).
# Keeps the platform workflow usable both during the hybrid window and if
# EKS is ever rebuilt later.

on:
  push:
    branches: ['**']
    paths:
      - 'envs/prod/eu-west-1/platform/**'
      - '.github/workflows/terraform.yml'
  pull_request:
    branches: [main]
    paths:
      - 'envs/prod/eu-west-1/platform/**'
      - '.github/workflows/terraform.yml'
  workflow_dispatch:
    inputs:
      action:
        description: 'Terraform action'
        type: choice
        options:
          - plan
          - apply
          - destroy
        default: plan

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  TF_WORKING_DIR: envs/prod/eu-west-1/platform
  AWS_REGION: eu-west-1
  EKS_CLUSTER_NAME: namiview-prod

concurrency:
  group: terraform-platform-prod-eu-west-1
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Platform has kubernetes + helm providers; they need a kubeconfig
      # pointing at the EKS cluster. Best-effort: if the cluster is gone
      # (post-decommission window), TF will fail clearly on the k8s/helm
      # resources — which is the correct signal.
      - name: Update kubeconfig for EKS
        run: |
          aws eks update-kubeconfig \
            --region ${{ env.AWS_REGION }} \
            --name ${{ env.EKS_CLUSTER_NAME }} \
            || echo "EKS cluster not reachable — TF will fail on k8s providers if any are in plan"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform Init
        run: terraform init

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        if: github.event.inputs.action != 'destroy'
        run: terraform plan -out=tfplan -input=false

      - name: Terraform Plan (Destroy)
        if: github.event.inputs.action == 'destroy'
        run: terraform plan -destroy -out=tfplan -input=false

      - name: Upload Plan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-platform
          path: ${{ env.TF_WORKING_DIR }}/tfplan
          retention-days: 7

  apply:
    needs: plan
    # Auto-apply on merge to main. workflow_dispatch retained for both
    # explicit apply (rollback re-application) and destroy (D-day path).
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.action == 'apply' || github.event.inputs.action == 'destroy'))
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig for EKS
        run: |
          aws eks update-kubeconfig \
            --region ${{ env.AWS_REGION }} \
            --name ${{ env.EKS_CLUSTER_NAME }} \
            || echo "EKS cluster not reachable — TF will fail on k8s providers if any are in plan"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform Init
        run: terraform init

      - name: Download Plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan-platform
          path: ${{ env.TF_WORKING_DIR }}

      - name: Terraform Apply
        run: terraform apply -auto-approve -input=false tfplan
